[package]
name = "coinflip"
version = "0.1.0"
description = "Peer-to-peer Solana coinflip"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "coinflip"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"

[workspace]
resolver = "2"
members = [".", "mock-vrf"]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
